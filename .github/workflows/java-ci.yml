name: java-ci
on:
  pull_request:
    paths: ["orders-java/**"]
  push:
    branches: [main]
    paths: ["orders-java/**"]
permissions:
  contents: read
jobs:
  maven-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: mvn test
        run: mvn -B -q test
