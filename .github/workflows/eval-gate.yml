name: eval-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic pytest
      - name: Unit tests
        run: pytest -q
      - name: Golden set against the baseline
        run: python evals/ci_gate.py
